name: Static production security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify dependency boundary
        run: node scripts/verify-dependency-boundary.mjs
      - name: Verify immutable production snapshot
        run: npm run verify:production
      - name: Build deterministic production output
        run: npm run build:production
